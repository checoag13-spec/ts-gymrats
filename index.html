<title>TS Gymrats</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom));transition:background .25s}
.th-checo{--p:#14284B;--p2:#2B4C8C;--soft:#E7ECF6;--on:#fff;--bg:#F3F5FA;--ink:#14213D;--line:#D5DDEC;--chip:#DCE4F4;--ico:#14284B}
.th-esposa{--p:#D8A7B1;--p2:#B87686;--soft:#FBEDEF;--on:#3A1F27;--bg:#FDF6F7;--ink:#3A1F27;--line:#F0D9DD;--chip:#F6DDE1;--ico:#B87686}
.th-super{--p:#14284B;--p2:#14284B;--chip:#E6E8F0;--soft:#EEF0F7;--on:#fff;--bg:#F6F6F9;--ink:#1d2236;--line:#E1E3EC}
header{position:sticky;top:0;z-index:20;background:var(--p);color:var(--on);padding:calc(10px + env(safe-area-inset-top)) 16px 12px;transition:background .25s}
.th-super header{background:linear-gradient(100deg,#14284B 50%,#D8A7B1)}
.brand{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.brand img{width:44px;height:44px;border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.4)}
.brand .t1{font-weight:800;letter-spacing:.14em;font-size:17px;line-height:1}
.brand .t2{font-size:11px;opacity:.8;letter-spacing:.05em;margin-top:3px}
.who{margin-left:auto;display:flex;background:rgba(255,255,255,.18);border-radius:999px;padding:3px}
.th-esposa .who{background:rgba(58,31,39,.12)}
.who button{border:0;background:transparent;color:inherit;font:600 13px inherit;font-family:inherit;padding:7px 13px;border-radius:999px;cursor:pointer}
.who button.on{background:#fff;color:#14284B;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.who button.on.e{color:#9b5666}
main{max-width:720px;margin:0 auto;padding:14px 14px 20px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--p2);margin:18px 4px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(20,33,61,.05)}
.acc-h{display:flex;align-items:center;gap:12px;padding:14px;width:100%;border:0;background:#fff;text-align:left;font-family:inherit;cursor:pointer;color:var(--ink)}
.acc-h .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.acc-h .tt{flex:1;min-width:0}
.acc-h .tt b{display:block;font-size:16px}
.acc-h .tt span{display:block;font-size:12.5px;opacity:.7;margin-top:2px}
.chev{transition:transform .2s;opacity:.5;font-size:18px}
.open>.acc-h .chev{transform:rotate(90deg)}
.open>.acc-h{background:var(--p);color:var(--on)}
.open>.acc-h .ic{background:rgba(255,255,255,.2)}
.th-esposa .open>.acc-h .ic{background:rgba(58,31,39,.12)}
.ic .muscle{width:38px;height:38px;object-fit:contain;display:block;filter:var(--muscle-filter)}
.ic.tr.pair{width:66px;grid-template-columns:1fr 1fr;gap:0;padding:2px}
.ic.tr.pair .muscle{width:31px;height:38px}
.ic.tr.triple{width:76px;grid-template-columns:repeat(3,1fr);gap:0;padding:2px}
.ic.tr.triple .muscle{width:24px;height:36px}
.th-checo{--muscle-filter:brightness(0) saturate(100%) invert(14%) sepia(21%) saturate(2656%) hue-rotate(181deg) brightness(93%) contrast(94%)}
.th-esposa{--muscle-filter:brightness(0) saturate(100%) invert(68%) sepia(19%) saturate(568%) hue-rotate(298deg) brightness(91%) contrast(88%)}
.ic.tr{color:var(--ico)}
.fg .o{fill:none;stroke:currentColor;stroke-width:1.2;opacity:.4}
.fg .f{fill:currentColor;stroke:currentColor;stroke-width:1.2}
.acc-h .tt span.badge{display:inline-block;opacity:1;margin-top:0}
.open>.acc-h .ic.tr{background:#fff}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--p2);color:#fff;margin-left:6px;vertical-align:2px;letter-spacing:.05em}
.th-esposa .badge{background:#9b5666}
.acc-b{padding:10px 12px 14px;background:var(--bg)}
.grp{background:#fff;border:1px solid var(--line);border-left:4px solid var(--p2);border-radius:12px;padding:8px 10px;margin-bottom:9px}
.grp .gl{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--p2);margin:2px 0 6px;display:flex;align-items:center;gap:6px}
.grp .gl i{font-style:normal;background:var(--chip);color:var(--ink);padding:1px 7px;border-radius:99px;font-size:10px;letter-spacing:.04em}
.ex{padding:8px 2px;border-top:1px dashed var(--line)}
.ex:first-of-type{border-top:0}
.ex .n{font-weight:650;font-size:15px}
.ex .m{font-size:12.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:5px}
.pill{background:var(--chip);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.t{background:transparent;border:1px solid var(--line);font-weight:500}
.cardio{display:flex;gap:10px;align-items:center;background:#fff;border:1px dashed var(--p2);border-radius:12px;padding:10px 12px;font-size:14px}
.cardio svg{width:22px;height:22px;fill:none;stroke:var(--ico);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.intra{margin-top:9px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--p2);border-radius:12px;padding:10px 12px}
.intra b{display:block;color:var(--p2);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.intra .ir{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14px}
.intra .ii{width:22px;text-align:center;flex:none}
.rest{text-align:center;padding:18px 10px;font-size:15px}
.btn{border:0;border-radius:10px;padding:9px 14px;font:600 13px inherit;font-family:inherit;background:var(--chip);color:var(--ink);cursor:pointer}
.btn.p{background:var(--p2);color:#fff}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.macros{padding:14px}
.macros .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.macros .top b{font-size:22px}
.mc{margin:9px 0}
.mc .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar{height:8px;border-radius:9px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--p2);border-radius:9px}
.opt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.opt .ol{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--p2);margin-bottom:6px}
.opt ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.55}
.opt .one{font-size:15px;font-weight:600}
.empty{text-align:center;padding:34px 18px;background:#fff;border:2px dashed var(--p);border-radius:18px;margin-top:8px}
.empty .big{font-size:40px}
.empty b{display:block;margin:6px 0 4px;font-size:17px}
.empty span{font-size:14px;opacity:.75}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:30}
nav .in{display:flex;width:100%;max-width:720px}
nav button{flex:1;border:0;background:none;font-family:inherit;padding:6px 0;color:#7b8296;cursor:pointer;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1.1}
nav button.on{color:var(--p2)}
.th-super nav button.on{color:#14284B}
.seg{display:flex;background:#E9EAF0;border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:600 14px inherit;font-family:inherit;color:#555;cursor:pointer}
.seg button.on{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pcard{border-radius:16px;margin-bottom:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.pcard>.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--p);color:var(--on);font-weight:700;cursor:pointer;border:0;width:100%;font-family:inherit;font-size:16px;text-align:left}
.pcard>.ph small{margin-left:auto;font-weight:500;opacity:.8;font-size:12px}
.pcard .pb{padding:8px 12px 12px}
.mrow{padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.mhead b{font-size:14.5px;flex:1}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:#555}
.step button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;line-height:1;cursor:pointer;color:var(--ink);padding:0}
.step b{min-width:16px;text-align:center;font-size:14px;color:var(--ink)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--p2);flex:none;display:grid;place-items:center;color:transparent;font-size:14px;font-weight:900;transition:.15s}
.ck.on{background:var(--p2);color:#fff}
.copt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;cursor:pointer;background:#fff}
.copt.on{border-color:var(--p2);background:var(--soft)}
.copt .tx{flex:1;font-size:13px;line-height:1.35}
.copt .tx b{display:block;font-size:12px;color:var(--p2);letter-spacing:.05em;text-transform:uppercase}
.warn{font-size:12px;color:#b25a00;margin-top:2px}
.okk{font-size:12px;color:#2a7a45;margin-top:2px}
.rl-top{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 4px 10px}
.rl-top b{font-size:34px;line-height:1}
.rl-top span{font-size:13px;color:#777}
.rsec{background:#fff;border-radius:14px;padding:6px 14px 4px;margin-bottom:12px;border:1px solid var(--line)}
.rsec h3{margin:8px 0 2px;font-size:17px;font-weight:800;color:#14284B;display:flex;justify-content:space-between}
.rsec h3 em{font-style:normal;font-weight:500;color:#999;font-size:14px}
.ri{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid #eee;cursor:pointer}
.rsec h3+.ri{border-top:0}
.rc{width:26px;height:26px;border-radius:50%;border:2px solid #b8bccb;flex:none;display:grid;place-items:center;color:transparent;font-weight:900;font-size:14px;transition:.15s}
.ri.done .rc{background:#14284B;border-color:#14284B;color:#fff}
.ri .nm{font-size:16px}
.ri .sb{font-size:12.5px;color:#888;margin-top:2px}
.ri.done .nm{color:#aaa;text-decoration:line-through}
.dots{margin-left:auto;display:flex;gap:4px;padding-top:6px}
.dots i{width:9px;height:9px;border-radius:50%}
.d-c{background:#14284B}.d-e{background:#D8A7B1}
.hint{font-size:13px;color:#777;padding:6px 4px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:50;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:.95}
.sync{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7bd88f;margin-left:6px;vertical-align:1px}
.sync.off{background:#f3b04a}
.load{text-align:center;padding:40px 16px;color:#777;font-size:14px}
.ro{font-size:12.5px;background:#FFF6E5;color:#8a5a00;border:1px solid #F3DDB0;border-radius:10px;padding:8px 10px;margin:6px 0 10px}
.ed .who2{display:flex;gap:8px;margin-bottom:10px}
.ed .who2 button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;font:700 14px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.ed .who2 button.on{border-color:var(--p2);background:var(--soft)}
.ed textarea{width:100%;min-height:200px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:15px/1.45 inherit;font-family:inherit;color:var(--ink);background:#fff;resize:vertical}
.ed textarea:focus{outline:none;border-color:var(--p2)}
.ed .tips{font-size:13px;color:#666;line-height:1.5;margin:4px 4px 12px}
.ed .tips b{color:var(--ink)}
.prev{background:#fff;border:1.5px solid var(--p2);border-radius:14px;padding:12px 14px;margin-top:12px}
.prev h4{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--p2)}
.prev p{margin:0 0 8px;font-size:14.5px;line-height:1.45}
.prev ul{margin:0 0 8px;padding-left:18px;font-size:13.5px;line-height:1.5}
.prev .warn{margin:4px 0}
.status{font-size:13.5px;color:#666;margin-top:10px;white-space:pre-wrap}
.btn[disabled]{opacity:.5;cursor:default}
.pdfpick{display:flex;align-items:center;gap:12px;border:2px dashed var(--p2);border-radius:14px;padding:14px;background:#fff;cursor:pointer;margin-bottom:4px}
.pdfpick.dis{opacity:.5;pointer-events:none}
.pdfpick .pi{font-size:28px}
.pdfpick .pt b{display:block;font-size:15px;word-break:break-word}
.pdfpick .pt small{display:block;font-size:12.5px;color:#777;margin-top:2px}
.who2 button[disabled],.seg button[disabled]{opacity:.55}
.addx{display:flex;gap:8px;margin:0 0 12px}
.addx input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}

 const T=SEL[pk].tot[mid]??m.def??7;const b=Math.floor(T/ks.length);let r=T-b*ks.length;

// Importar: {app:"ts-gymrats", summary, docs:{"plan/checo":{...}, ...}}
const IMPORTABLE=/^(plan\/(checo|esposa|catalog)|super\/(done|extras|sel-checo|sel-esposa))$/;
let IMP=null;
document.addEventListener('change',async e=>{
 if(e.target.id!=='impin')return;const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
 S.edRes=null;S.edMsg='';
 try{const j=JSON.parse(await f.text());
  if(!j||j.app!=='ts-gymrats'||!j.docs||typeof j.docs!=='object')throw new Error('Este archivo no es de TS Gymrats');
  const docs={};Object.entries(j.docs).forEach(([p,d])=>{if(IMPORTABLE.test(p)&&d&&typeof d==='object')docs[p]=d});
  if(!Object.keys(docs).length)throw new Error('El archivo no trae cambios');
  const lines=[],dietPk=[];
  PK.forEach(pk=>{const d=docs['plan/'+pk];if(!d)return;const cur=PLAN[pk]||{};
   const tr=JSON.stringify(d.training)!==JSON.stringify(cur.training),di=JSON.stringify(d.diet)!==JSON.stringify(cur.diet);
   if(tr)lines.push(`${d.name||pname(pk)}: rutina nueva (${(d.training||[]).reduce((a,x)=>a+(x.groups||[]).reduce((b,g)=>b+(g.ex||[]).length,0),0)} ejercicios)`);
   if(di){lines.push(`${d.name||pname(pk)}: dieta nueva (${d.diet&&d.diet.kcal} kcal, ${(d.diet&&d.diet.meals||[]).length} comidas)`);dietPk.push(pk)}
   if(!tr&&!di)lines.push(`${d.name||pname(pk)}: sin cambios`)});
  if(docs['plan/catalog'])lines.push('Catálogo de ingredientes actualizado');
  Object.keys(docs).filter(p=>p.startsWith('super/')).length&&lines.push('Datos de la lista del súper');
  IMP=docs;S.edRes={summary:String(j.summary||''),lines,dietPk};
 }catch(err){IMP=null;S.edMsg='No se pudo leer el archivo: '+(err&&err.message||'error')}
 render()});

async function doApply(){
 if(!IMP||!S.edRes)return;const docs=IMP,R=S.edRes;let ok=true;
 for(const pk of PK){if(docs['plan/'+pk]&&PLAN[pk]){ok=await put('plan_prev/'+pk,d=>d.set({profile:PLAN[pk],at:new Date().toISOString()}));if(!ok)break}}
 if(ok)for(const [p,d] of Object.entries(docs)){ok=await put(p,x=>x.set(d));if(!ok)break;
  const m=p.match(/^plan\/(checo|esposa)$/);if(m)PLAN[m[1]]=d;if(p==='plan/catalog')CAT=d}
 if(ok)for(const pk of R.dietPk){if(!docs['super/sel-'+pk]){SEL[pk]={sel:{},tot:{}};await saveSel(pk)}}
 if(ok){IMP=null;S.edRes=null;S.edMsg='';toast('Guardado. Ya lo ven los dos ✓')}
 render()}

async function doUndo(pk){
 if(!DB){toast('Sin conexión');return}
 let snap;try{snap=await DB.doc('plan_prev/'+pk).get()}catch(e){toast('No se pudo leer');return}
 if(!snap.exists){toast('No hay cambios anteriores para '+pname(pk));return}
 if(!confirm('¿Regresar la rutina y dieta de '+pname(pk)+' a como estaban antes del último cambio?'))return;
 const prev=snap.data().profile;const cur=PLAN[pk];
 let ok=await put('plan/'+pk,d=>d.set(prev));
 if(ok){await put('plan_prev/'+pk,d=>d.set({profile:cur,at:new Date().toISOString()}));
  if(JSON.stringify(prev.diet)!==JSON.stringify(cur.diet)){SEL[pk]={sel:{},tot:{}};await saveSel(pk)}
  PLAN[pk]=prev;toast('Cambio deshecho');render()}}

function doExport(){

 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

function parseCfgText(t){
 // Acepta el bloque "const firebaseConfig = {...}" tal cual lo da Firebase, o JSON
 const m=String(t).match(/\{[\s\S]*\}/);if(!m)return null;
 let o=null;try{o=JSON.parse(m[0])}catch(e){try{o=JSON.parse(m[0].replace(/\/\/.*$/gm,'').replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}'))}catch(e2){}}
 if(!o||!o.apiKey||!o.projectId)return null;
 return {apiKey:o.apiKey,authDomain:o.authDomain,projectId:o.projectId,storageBucket:o.storageBucket,messagingSenderId:o.messagingSenderId,appId:o.appId}}
function loadCfg(){
 const h=location.hash.match(/[#&]s=([A-Za-z0-9+/_-]+)/);
 if(h){try{const c=JSON.parse(b64d(h[1].replace(/-/g,'+').replace(/_/g,'/')));if(c&&c.fb&&c.k){try{localStorage.setItem(CFG_KEY,JSON.stringify(c))}catch(e){}return c}}catch(e){}}
 try{const c=JSON.parse(localStorage.getItem(CFG_KEY)||'null');if(c&&c.fb&&c.k)return c}catch(e){}
 return null}
const shareLink=()=>location.origin+location.pathname+'#s='+b64e(JSON.stringify(CFG)).replace(/\+/g,'-').replace(/\//g,'_');

function viewSetup(){
 return `<div class="ed"><h2 class="sec">Configurar TS Gymrats</h2>
 <div class="tips">Escribe el código familiar <b>una sola vez</b>. Después, desde Editar puedes copiar un enlace que ya viene configurado para el otro iPhone.</div>
 ${DEFAULT_FB?'':`<div class="tips" style="margin-bottom:6px"><b>1. Configuración de Firebase</b> (el bloque <i>const firebaseConfig = {…}</i>)</div>
 <textarea id="cfgtx" style="min-height:150px" placeholder="const firebaseConfig = {…};"></textarea>`}
 <div class="tips" style="margin:10px 4px 6px"><b>Código familiar</b> (el que te dio Claude)</div>
 <input id="cfgk" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;font-family:ui-monospace,Menlo,monospace">
 <div class="row-end"><button class="btn p" data-a="savecfg">Conectar</button></div>
 ${S.edMsg?`<div class="status">${esc(S.edMsg)}</div>`:''}</div>`}

async function connect(){
 if(!CFG)return;
 let A,F;
 try{A=await import(FB+'firebase-app.js');F=await import(FB+'firebase-firestore.js')}
 catch(e){ONLINE=false;toast('Sin internet: mostrando lo último guardado');render();return}
 const app=A.initializeApp(CFG.fb);
 let fs;try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){fs=F.getFirestore(app)}
 const ref=p=>F.doc(fs,'h',CFG.k,'d',p.replace(/\//g,'__'));
 const wrap=s=>({exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
 const err=e=>{const c=e&&e.code;return c==='permission-denied'?{code:'invalid_argument',message:'Código familiar incorrecto'}:{code:c==='resource-exhausted'?'quota_exceeded':'unavailable',message:e&&e.message}};
 DB={doc:p=>({
  get:async()=>{try{return wrap(await F.getDoc(ref(p)))}catch(e){throw err(e)}},
  set:async d=>{try{await F.setDoc(ref(p),d)}catch(e){throw err(e)}},
  update:async d=>{try{await F.setDoc(ref(p),d,{merge:true})}catch(e){throw err(e)}},
  onSnapshot:(n,e)=>F.onSnapshot(ref(p),{includeMetadataChanges:true},s=>n(wrap(s)),x=>e&&e(err(x)))})};
 let denied=false;
 const onErr=e=>{ONLINE=false;if(e&&e.code==='invalid_argument'&&!denied){denied=true;toast('Código familiar incorrecto o reglas sin publicar')}render()};
 const sub=(path,fn)=>DB.doc(path).onSnapshot(s=>{ONLINE=!s.metadata.fromCache;fn(s);render()},onErr);
 PK.forEach(pk=>{
  sub('plan/'+pk,s=>{if(s.exists)PLAN[pk]=JSON.parse(JSON.stringify(s.data()))});
  sub('super/sel-'+pk,s=>{if(s.metadata.hasPendingWrites)return;const x=s.exists?s.data():{};SEL[pk]={sel:JSON.parse(JSON.stringify(x.sel||{})),tot:JSON.parse(JSON.stringify(x.tot||{}))}})});
 sub('plan/catalog',s=>{if(s.exists)CAT=JSON.parse(JSON.stringify(s.data()));else if(!s.metadata.fromCache&&!PLAN.checo){FIRST=true}});
 sub('super/extras',s=>{extraExists=s.exists;if(s.metadata.hasPendingWrites)return;EXTRA=JSON.parse(JSON.stringify((s.exists&&s.data().items)||{}))});
 sub('super/done',s=>{doneExists=s.exists;if(s.metadata.hasPendingWrites)return;DONE={...((s.exists&&s.data().map)||{})}});
 render()}

// Base vacía: primera vez → pedir el respaldo inicial
function viewFirst(){
 return `<div class="ed"><h2 class="sec">¡Conectado! ✓</h2><div class="tips">La base de datos está vacía. Importa el archivo <b>ts-gymrats-datos.json</b> que te mandó Claude para cargar rutinas, dietas y la lista del súper. Esto se hace en un solo iPhone.</div>
 <label class="pdfpick"><input type="file" id="impin" accept="application/json,.json,text/plain" hidden><span class="pi">📥</span><span class="pt"><b>Importar archivo de datos</b><small>ts-gymrats-datos.json</small></span></label>
 ${S.edRes?`<div class="prev"><h4>Vista previa</h4><ul>${S.edRes.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul><div class="row-end"><button class="btn p" data-a="apply">Cargar datos</button></div></div>`:''}
 ${S.edMsg?`<div class="status">${esc(S.edMsg)}</div>`:''}</div>`}

CFG=loadCfg();
if(CFG)connect();else render();
</script>
